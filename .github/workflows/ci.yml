name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    env:
      # Dummy URL for build-time env validation — no real DB needed in CI
      DATABASE_URL: postgresql://rotasegura:rotasegura@localhost:5432/rotasegura?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (runs prisma generate via postinstall)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
