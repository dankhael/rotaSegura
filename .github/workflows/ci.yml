name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://rotasegura:rotasegura@localhost:5432/rotasegura?schema=public

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rotasegura
          POSTGRES_PASSWORD: rotasegura
          POSTGRES_DB: rotasegura
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (runs prisma generate via postinstall)
        run: npm ci

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
